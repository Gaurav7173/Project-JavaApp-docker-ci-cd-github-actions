name: java app build and deploy

on:
  push:
    branches: [ main ]
 
env:
  image_name: demoproject

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'

          - name: build-jar
            run: chmod +x mvnw && ./mvnw clean package -DskipTests

          - name: Build Docker image
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.image_name }} .
            
          - name: Log in to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ secrets.DOCKER_USERNAME}}
              password: ${{ secrets.DOCKER_PASSWORD }}
          - name: Push Docker image            
            run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.image_name }}:latest

          - name: Deploy to server
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ secrets.SERVER_IP }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SERVER_SSH_KEY }}

              script: |
                docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.image_name }}:latest
                docker stop demoproject || true
                docker rm demoproject || true
                docker run -d --name demoproject -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/${{ env.image_name }}:latest
                docker image prune -f
